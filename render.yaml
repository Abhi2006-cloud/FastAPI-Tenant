# ==============================================================================
# Render Infrastructure Blueprint (render.yaml)
# AI Workspace SaaS Zero-Cost Deployment Architecture
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI Web Service (Production API + Embedded RQ Worker)
  # Free tier service with Postgres BYTEA storage and Upstash Redis
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-workspace-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/live
    autoDeploy: true
    startCommand: sh -c "alembic upgrade head && gunicorn -w ${WEB_CONCURRENCY:-1} -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: APP_NAME
        value: AI Workspace SaaS Backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: ALGORITHM
        value: HS256
      - key: REDIS_URL
        sync: false
      - key: EMBEDDED_WORKER
        value: "true"
      - key: EMBEDDED_WORKER_QUEUES
        value: "high,default,low,email"
      - key: JOB_SYNC_MODE
        value: "false"
      - key: SEARCH_ENABLED
        value: "false"
      - key: EMAIL_MODE
        value: development
      - key: EMAIL_PROVIDER
        value: console
      - key: STORAGE_BACKEND
        value: postgres
      - key: MAX_UPLOAD_SIZE_MB
        value: "2"
      - key: INVITATION_EXPIRE_HOURS
        value: "72"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
